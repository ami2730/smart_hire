services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthire-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smarthire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smarthire}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarthire-network

  ml_service:
    build:
      context: ./apps/ml_service
      dockerfile: Dockerfile
    container_name: smarthire-ml-service
    restart: unless-stopped
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - NODE_BACKEND_URL=http://backend:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smarthire-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: smarthire-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smarthire}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-super-secret-jwt-access-key-minimum-16-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-jwt-refresh-key-minimum-16-chars}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - ML_SERVICE_URL=http://ml_service:8000
      - CORS_ORIGIN=http://localhost:3000
      - LOG_LEVEL=info
      - UPLOAD_DIR=./uploads
      - MAX_RESUME_SIZE_MB=10
    depends_on:
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    volumes:
      - resume_uploads:/app/uploads/resumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - smarthire-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: smarthire-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - smarthire-network

volumes:
  postgres_data:
  resume_uploads:

networks:
  smarthire-network:
    driver: bridge
