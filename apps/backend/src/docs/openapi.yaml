openapi: 3.0.3

info:
  title: SmartHire API
  description: |
    AI-assisted candidate screening and resume skill-matching engine.

    ## Authentication
    Most endpoints require a **Bearer JWT** access token obtained from `POST /api/v1/auth/login`.

    Include the token in all authenticated requests:
    ```
    Authorization: Bearer <accessToken>
    ```

    Access tokens expire after **15 minutes**. Use `POST /api/v1/auth/refresh` with a valid refresh token (7-day TTL) to obtain new tokens.

    ## Rate Limiting
    | Limiter | Window | Limit |
    |---|---|---|
    | Global API | 15 min | 1 000 requests / IP |
    | Auth endpoints | 15 min | 20 requests / IP |
    | ML / screening | 5 min | 30 requests / IP |

    ## Response Format
    All responses follow a consistent envelope:

    **Success:**
    ```json
    { "success": true, "data": { ... }, "pagination": { ... } }
    ```
    **Error:**
    ```json
    { "success": false, "error": { "code": "ERROR_CODE", "message": "...", "details": [...] } }
    ```
  version: 1.0.0
  contact:
    name: SmartHire Team

servers:
  - url: http://localhost:4000
    description: Local development server
  - url: http://localhost:4000/api/v1
    description: API v1 base (use this for Try-it-out)

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Registration, login, token refresh, and current user
  - name: Jobs
    description: Job posting lifecycle management
  - name: Candidates
    description: Candidate profiles, skills, education, and experience
  - name: Resumes
    description: Resume file uploads and management
  - name: Applications
    description: Job application submission and AI screening
  - name: Ranking
    description: Batch AI candidate ranking leaderboard
  - name: Reports
    description: Dashboard analytics and pipeline reports
  - name: Audit Logs
    description: Security audit trail (Admin only)

# ─────────────────────────────────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /api/v1/auth/login

  # ─── Reusable Schemas ───────────────────────────────────────────────────────
  schemas:

    # ── Pagination ─────────────────────────────────────────────────────────────
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    # ── Error ──────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request payload
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string

    # ── Auth ───────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          minLength: 8
          example: "Str0ngPass!"
        role:
          type: string
          enum: [RECRUITER, ADMIN]
          default: RECRUITER

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          example: "Str0ngPass!"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [RECRUITER, ADMIN]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (15 min)
        refreshToken:
          type: string
          description: Long-lived JWT (7 days)

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserResponse'
            tokens:
              $ref: '#/components/schemas/AuthTokens'

    # ── Jobs ───────────────────────────────────────────────────────────────────
    CreateJobRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Senior Backend Engineer
        description:
          type: string
          minLength: 10
          example: We are looking for an experienced backend engineer...
        minimumExperienceYears:
          type: number
          minimum: 0
          default: 0
          example: 3
        requiredSkills:
          type: array
          items:
            type: string
          example: [TypeScript, Node.js, PostgreSQL]
        educationRequirements:
          type: string
          example: Bachelor's degree in Computer Science or equivalent

    UpdateJobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          minLength: 10
        minimumExperienceYears:
          type: number
          minimum: 0
        requiredSkills:
          type: array
          items:
            type: string
        educationRequirements:
          type: string

    JobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recruiterId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CLOSED]
        minimumExperienceYears:
          type: number
        requirements:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            requiredSkills:
              type: array
              items:
                type: string
            educationRequirements:
              type: string
              nullable: true
            minimumExperienceYears:
              type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Candidates ─────────────────────────────────────────────────────────────
    CreateCandidateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
          example: John Smith
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          example: "+1-555-0100"
        location:
          type: string
          example: San Francisco, CA
        summary:
          type: string
          example: Experienced full-stack developer with 5+ years...

    UpdateCandidateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        location:
          type: string
        summary:
          type: string

    AddSkillRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Python
        yearsOfExperience:
          type: number
          minimum: 0
          example: 3
        proficiencyLevel:
          type: string
          example: Advanced

    AddEducationRequest:
      type: object
      required: [institution, degree]
      properties:
        institution:
          type: string
          example: MIT
        degree:
          type: string
          example: Bachelor of Science
        field:
          type: string
          example: Computer Science
        startDate:
          type: string
          format: date
          example: "2016-09-01"
        endDate:
          type: string
          format: date
          example: "2020-06-01"

    AddExperienceRequest:
      type: object
      required: [company, jobTitle]
      properties:
        company:
          type: string
          example: Acme Corp
        jobTitle:
          type: string
          example: Software Engineer
        description:
          type: string
          example: Built and maintained backend microservices...
        startDate:
          type: string
          format: date
          example: "2020-07-01"
        endDate:
          type: string
          format: date
          example: "2023-01-01"
        years:
          type: number
          example: 2.5

    CandidateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              skill:
                type: object
                properties:
                  name:
                    type: string
                  category:
                    type: string
                    nullable: true
              yearsOfExperience:
                type: number
                nullable: true
              proficiencyLevel:
                type: string
                nullable: true
        education:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              institution:
                type: string
              degree:
                type: string
              field:
                type: string
                nullable: true
              startDate:
                type: string
                format: date-time
                nullable: true
              endDate:
                type: string
                format: date-time
                nullable: true
        experience:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              company:
                type: string
              jobTitle:
                type: string
              description:
                type: string
                nullable: true
              years:
                type: number
                nullable: true
              startDate:
                type: string
                format: date-time
                nullable: true
              endDate:
                type: string
                format: date-time
                nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Resumes ────────────────────────────────────────────────────────────────
    ResumeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        originalFileName:
          type: string
          example: john_smith_cv.pdf
        mimeType:
          type: string
          example: application/pdf
        fileSize:
          type: integer
          example: 204800
        processingStatus:
          type: string
          enum: [UPLOADED, PROCESSING, PROCESSED, FAILED]
        uploadedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
        candidate:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string

    # ── Applications ───────────────────────────────────────────────────────────
    CreateApplicationRequest:
      type: object
      required: [candidateId, jobId]
      properties:
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        resumeId:
          type: string
          format: uuid
          description: If omitted, defaults to the candidate's most recent resume

    UpdateApplicationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPLIED, PROCESSING, SCREENED, SHORTLISTED, REVIEWED, REJECTED, HIRED]

    ScreeningResultResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        overallScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.82
        skillMatchScore:
          type: number
          format: float
          example: 0.9
        experienceMatchScore:
          type: number
          format: float
          example: 0.75
        educationMatchScore:
          type: number
          format: float
          example: 0.8
        semanticSimilarityScore:
          type: number
          format: float
          example: 0.78
        matchingSkills:
          type: array
          items:
            type: string
          example: [Python, Django, PostgreSQL]
        missingSkills:
          type: array
          items:
            type: string
          example: [Kubernetes]
        recommendation:
          type: string
          enum: [STRONG_MATCH, GOOD_MATCH, MODERATE_MATCH, LOW_MATCH]
        explanation:
          type: string
          description: JSON-stringified explanation from the ML model
        modelVersion:
          type: string
          example: "1.0.0"
        createdAt:
          type: string
          format: date-time

    ApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        resumeId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [APPLIED, PROCESSING, SCREENED, SHORTLISTED, REVIEWED, REJECTED, HIRED]
        appliedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        candidate:
          $ref: '#/components/schemas/CandidateResponse'
        job:
          $ref: '#/components/schemas/JobResponse'
        screeningResults:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningResultResponse'

    # ── Ranking ────────────────────────────────────────────────────────────────
    RankingEntryResponse:
      type: object
      properties:
        candidateId:
          type: string
          format: uuid
        candidateName:
          type: string
        applicationId:
          type: string
          format: uuid
        overallScore:
          type: number
          example: 0.87
        recommendation:
          type: string
          enum: [STRONG_MATCH, GOOD_MATCH, MODERATE_MATCH, LOW_MATCH]
        rank:
          type: integer
          example: 1

    BatchRankRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Re-evaluate already-screened candidates
        candidateIds:
          type: array
          items:
            type: string
            format: uuid
          description: Limit ranking to specific candidates (omit for all)

    # ── Reports ────────────────────────────────────────────────────────────────
    OverviewReport:
      type: object
      properties:
        totalJobs:
          type: integer
        publishedJobs:
          type: integer
        totalCandidates:
          type: integer
        totalApplications:
          type: integer
        totalScreened:
          type: integer
        totalHired:
          type: integer

    # ── Audit ──────────────────────────────────────────────────────────────────
    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          example: USER_LOGIN
        resource:
          type: string
          example: USER
        resourceId:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the server process is alive. Does not check the database.
      operationId: getHealth
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
                      uptime:
                        type: number

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Returns 200 only when the database connection is available.
      operationId: getReadiness
      responses:
        '200':
          description: Server is ready
        '503':
          description: Database unavailable

  /api/v1/health:
    get:
      tags: [Health]
      summary: API v1 health
      operationId: getApiHealth
      responses:
        '200':
          description: API is healthy

  # ── Auth ────────────────────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a new recruiter (or admin) account and returns tokens immediately.
        Rate-limited to **20 requests / 15 min** per IP.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticates credentials and returns an access token (15 min) and refresh token (7 days).
        Rate-limited to **20 requests / 15 min** per IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
        '429':
          description: Rate limit exceeded

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchanges a valid refresh token for new access + refresh tokens.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Stateless logout — client should discard both tokens.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
        '401':
          description: Unauthorized

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns the authenticated user's profile.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized

  # ── Jobs ────────────────────────────────────────────────────────────────────
  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        Returns a paginated list of jobs.
        - **Unauthenticated** users only see `PUBLISHED` jobs.
        - **Recruiters** see their own jobs (any status) plus all published jobs.
        - **Admins** see all jobs regardless of status.
      operationId: listJobs
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          description: Search by title or description
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, CLOSED]
        - name: recruiterId
          in: query
          schema:
            type: string
            format: uuid
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, title]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: '#/components/schemas/JobResponse'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

    post:
      tags: [Jobs]
      summary: Create a job
      description: Creates a new job in `DRAFT` status. Requires authentication.
      operationId: createJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/JobResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a job by ID
      operationId: getJobById
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/JobResponse'
        '403':
          description: Draft job — not owned by user
        '404':
          description: Job not found

    patch:
      tags: [Jobs]
      summary: Update a job
      description: Partial update. Only the job's recruiter or an Admin can update.
      operationId: updateJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
      responses:
        '200':
          description: Job updated
        '403':
          description: Forbidden
        '404':
          description: Job not found

    delete:
      tags: [Jobs]
      summary: Delete a job
      operationId: deleteJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job deleted
        '403':
          description: Forbidden
        '404':
          description: Job not found

  /api/v1/jobs/{id}/publish:
    post:
      tags: [Jobs]
      summary: Publish a job
      description: |
        Transitions a `DRAFT` job to `PUBLISHED`.
        Requires at least one `requiredSkill` to be set.
      operationId: publishJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job published
        '400':
          description: No required skills set
        '403':
          description: Forbidden
        '404':
          description: Job not found

  /api/v1/jobs/{id}/close:
    post:
      tags: [Jobs]
      summary: Close a job
      description: Transitions a `PUBLISHED` job to `CLOSED`.
      operationId: closeJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job closed
        '403':
          description: Forbidden
        '404':
          description: Job not found

  /api/v1/jobs/{id}/rankings:
    get:
      tags: [Jobs, Ranking]
      summary: Get candidate rankings for a job
      description: Returns a ranked leaderboard of screened candidates for this job.
      operationId: getJobRankings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: minScore
          in: query
          schema:
            type: number
        - name: recommendation
          in: query
          schema:
            type: string
            enum: [STRONG_MATCH, GOOD_MATCH, MODERATE_MATCH, LOW_MATCH]
        - name: sortBy
          in: query
          schema:
            type: string
