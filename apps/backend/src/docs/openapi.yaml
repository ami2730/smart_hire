      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          description: Search by name, email, or location
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, email, createdAt]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated candidate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      candidates:
                        type: array
                        items:
                          $ref: '#/components/schemas/CandidateResponse'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

    post:
      tags: [Candidates]
      summary: Create a candidate
      operationId: createCandidate
