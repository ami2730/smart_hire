  # ── Resumes ─────────────────────────────────────────────────────────────────
  /api/v1/candidates/{candidateId}/resumes:
    post:
      tags: [Resumes]
      summary: Upload a resume
      description: |
        Uploads a resume file for a candidate. Accepted formats: **PDF**, **DOCX**, **DOC**.
        Maximum file size: **10 MB**.
        The file is stored on disk and a metadata record is created with `UPLOADED` status.
      operationId: uploadResume
      security:
        - BearerAuth: []
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
                  description: Resume file (PDF / DOCX / DOC, max 10 MB)
      responses:
        '201':
          description: Resume uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ResumeResponse'
        '400':
          description: Invalid file type or size
        '404':
          description: Candidate not found

    get:
      tags: [Resumes]
      summary: List candidate resumes
      operationId: listResumes
      security:
        - BearerAuth: []
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated resume list
        '404':
          description: Candidate not found

  /api/v1/resumes/{id}:
    get:
      tags: [Resumes]
      summary: Get resume metadata
      operationId: getResumeById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resume metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ResumeResponse'
        '404':
          description: Resume not found

    delete:
      tags: [Resumes]
      summary: Delete a resume
      description: Deletes the database record and the physical file from disk.
      operationId: deleteResume
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resume deleted
        '404':
          description: Resume not found

  /api/v1/resumes/{id}/download:
    get:
      tags: [Resumes]
      summary: Download resume file
      description: Streams the resume file with the original filename as `Content-Disposition`.
      operationId: downloadResume
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resume file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '404':
          description: Resume not found or file missing on disk

  # ── Applications ────────────────────────────────────────────────────────────
  /api/v1/applications:
    post:
      tags: [Applications]
      summary: Submit an application
      description: |
        Submits a candidate's application to a published job.
        - The job must have `PUBLISHED` status.
        - A candidate can only apply once per job (enforced by unique constraint).
        - If `resumeId` is omitted, the candidate's most recent resume is used.
      operationId: createApplication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application submitted
        '400':
          description: Validation error or job not published
        '404':
          description: Candidate, job, or resume not found
        '409':
          description: Already applied

    get:
      tags: [Applications]
      summary: List applications
      operationId: listApplications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: jobId
          in: query
          schema:
            type: string
            format: uuid
        - name: candidateId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [APPLIED, PROCESSING, SCREENED, SHORTLISTED, REVIEWED, REJECTED, HIRED]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [appliedAt, status, updatedAt]
            default: appliedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated application list

  /api/v1/applications/{id}:
    get:
      tags: [Applications]
      summary: Get application details
      description: Returns full application with candidate, job, resume, and screening results.
      operationId: getApplicationById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApplicationResponse'
        '404':
          description: Application not found

  /api/v1/applications/{id}/status:
    patch:
      tags: [Applications]
      summary: Update application status
      description: |
        Manually sets an application status.
        Recruiters can only update applications for their own jobs.
        Admins can update any.
      operationId: updateApplicationStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
      responses:
        '200':
          description: Status updated
        '403':
          description: Forbidden — not your job
        '404':
          description: Application not found

  /api/v1/applications/{id}/screen:
    post:
      tags: [Applications]
      summary: Trigger AI screening
      description: |
        Sends the application to the Python ML service for multi-criteria evaluation:
        - **Skill match** — required vs candidate skills
        - **Experience match** — years and descriptions
        - **Education match** — degree and institution
        - **Semantic similarity** — NLP-based resume / job description matching

        Persists a `ScreeningResult` and transitions the application to `SCREENED`.

        Use `?force=true` to re-evaluate an already-screened application.

        Rate-limited to **30 requests / 5 min** per IP.
      operationId: screenApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Screening complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      application:
                        $ref: '#/components/schemas/ApplicationResponse'
                      screeningResult:
                        $ref: '#/components/schemas/ScreeningResultResponse'
        '403':
          description: Forbidden
        '404':
          description: Application not found
        '429':
          description: ML rate limit exceeded
        '502':
          description: ML service error

  /api/v1/applications/{id}/screening:
    get:
      tags: [Applications]
      summary: Get screening history
      description: Returns all past screening evaluations for an application, newest first.
      operationId: getScreeningHistory
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Screening history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScreeningResultResponse'
        '404':
          description: Application not found

  # ── Ranking ─────────────────────────────────────────────────────────────────
  /api/v1/ranking/jobs/{id}:
    get:
      tags: [Ranking]
      summary: Get ranked leaderboard for a job
      operationId: getRankings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: minScore
          in: query
          schema:
            type: number
        - name: recommendation
          in: query
          schema:
            type: string
            enum: [STRONG_MATCH, GOOD_MATCH, MODERATE_MATCH, LOW_MATCH]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [matchScore, appliedAt]
            default: matchScore
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Ranked candidate leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      job:
                        type: object
                        properties:
                          id:
                            type: string
                          title:
                            type: string
                          status:
                            type: string
                      rankings:
                        type: array
                        items:
                          $ref: '#/components/schemas/RankingEntryResponse'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          description: Forbidden
        '404':
          description: Job not found

    post:
      tags: [Ranking]
      summary: Trigger batch AI ranking
      description: |
        Calls the ML service `POST /api/v1/screening/rank` to score and rank all
        eligible candidates in a single batch request. Persists results and returns
        the updated leaderboard. Rate-limited to **30 requests / 5 min** per IP.
      operationId: batchRank
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRankRequest'
      responses:
        '200':
          description: Batch ranking completed
        '403':
          description: Forbidden
        '404':
          description: Job not found
        '429':
          description: ML rate limit exceeded
        '502':
          description: ML service unavailable

