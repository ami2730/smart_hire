  # ── Audit Logs ──────────────────────────────────────────────────────────────
  /api/v1/audit-logs:
    get:
      tags: [Audit Logs]
      summary: Get security audit trail
      description: |
        Returns a paginated list of audit log entries.
        **Admin role required.**

        Logged actions include: `USER_REGISTER`, `USER_LOGIN`, `JOB_CREATE`,
        `JOB_PUBLISH`, `JOB_CLOSE`, `JOB_DELETE`, `APPLICATION_CREATE`,
        `APPLICATION_STATUS_UPDATE`, `SCREENING_EXECUTE`.
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            example: USER_LOGIN
        - name: resource
          in: query
          schema:
            type: string
            example: JOB
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogResponse'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '403':
          description: Admin role required
